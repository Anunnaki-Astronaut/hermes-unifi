name: Secret scan
on:
  push:
  pull_request:
  schedule:
    - cron: '23 7 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@b84c3d14d189e16da175e2c27fa8136603783ffc
        with:
          version: v3.90.12
          extra_args: --no-verification --results=verified,unknown
