name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check desktop/plugin.js
      - run: node --check scripts/render_screenshot.cjs
      - name: Render synthetic views
        run: |
          for view in overview sites devices isp; do
            node --experimental-vm-modules scripts/render_screenshot.cjs "$view" "/tmp/$view.html"
            cmp "/tmp/$view.html" "docs/screenshots/$view.html"
          done
      - run: git diff --check
